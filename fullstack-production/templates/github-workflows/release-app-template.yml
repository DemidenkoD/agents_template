# GitHub Actions Workflow Template: Zero-Data-Loss Release & Migration
# Strategy:
#   Deploys newly built code and applies pending schema migrations.
#   Routine releases NEVER wipe or reset database tables or caches: active
#   sessions, user accounts, and state persist across deployments.

name: release-app

on:
  workflow_dispatch:
    inputs:
      build_containers:
        description: 'Build containers on host before deploying'
        required: false
        type: boolean
        default: true
      skip_snapshot:
        description: 'Skip the pre-release database snapshot (not recommended)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  deploy:
    name: release app, migrate schema, swap containers
    runs-on: ubuntu-latest
    steps:
      - name: execute zero-downtime release via SSH
        uses: appleboy/ssh-action@v1
        env:
          BUILD_CONTAINERS: ${{ inputs.build_containers }}
          SKIP_SNAPSHOT: ${{ inputs.skip_snapshot }}
          IMAGE_TAG: release-${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BUILD_CONTAINERS,SKIP_SNAPSHOT,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            git fetch origin
            git checkout -f "${{ github.sha }}"

            ENV_FILE="${{ secrets.ENV_FILE || '.env' }}"
            export IMAGE_TAG

            # 1. Optional build step
            if [ "${BUILD_CONTAINERS}" = "true" ]; then
              echo "[deploy] Compiling container images..."
              docker compose --env-file "${ENV_FILE}" build
            fi

            # 2. Pre-release database safety snapshot
            if [ "${SKIP_SNAPSHOT}" != "true" ]; then
              echo "[deploy] Creating pre-release safety snapshot..."
              if [ -f "ops/backup.sh" ]; then
                bash ops/backup.sh --env-file "${ENV_FILE}"
              fi
            fi

            # 3. Apply schema migrations (non-destructive, deploy-only)
            echo "[deploy] Applying pending schema migrations..."
            docker compose --env-file "${ENV_FILE}" run --rm migrate

            # 4. Rolling container swap
            echo "[deploy] Performing rolling container swap..."
            docker compose --env-file "${ENV_FILE}" up -d --wait

            # 5. Clean up dangling images
            docker image prune -f || true

            # 6. Live Health Gate
            echo "[deploy] Verifying service health..."
            HEALTH_URL="${{ secrets.HEALTH_URL || 'http://localhost/api/health' }}"
            curl -fsSL -k "${HEALTH_URL}"
            echo -e "\n[deploy] Release completed successfully!"
